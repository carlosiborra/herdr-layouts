id = "carlosiborra.layouts"
name = "Herdr Layouts"
version = "0.5.0"
min_herdr_version = "0.9.5"
description = "Visual, recoverable pane layouts with favorites and saved layouts for Herdr"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Choose pane layout"
contexts = ["global"]
command = ["python3", "bin/herdr-layouts", "--open"]

[[actions]]
id = "favorite-1"
title = "Apply favorite 1"
contexts = ["global"]
command = ["python3", "bin/herdr-layouts", "--favorite", "1"]

[[actions]]
id = "favorite-2"
title = "Apply favorite 2"
contexts = ["global"]
command = ["python3", "bin/herdr-layouts", "--favorite", "2"]

